name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/conformance/package-lock.json
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - uses: actions/checkout@v4
        if: ${{ vars.CONFORMANCE_ENGINE_URL == '' && vars.CONFORMANCE_ENGINE_VERSION == '' }}
        with:
          repository: rivet-dev/rivet
          ref: 78cf1288ba44ebc6ea769be42c525b4be4819338
          path: .conformance-engine
          persist-credentials: false
      - name: Build matching OSS Engine
        if: ${{ vars.CONFORMANCE_ENGINE_URL == '' && vars.CONFORMANCE_ENGINE_VERSION == '' }}
        working-directory: .conformance-engine
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
          CARGO_BUILD_JOBS: "2"
        run: |
          rustup toolchain install stable --profile minimal
          RUSTUP_TOOLCHAIN=stable cargo build --locked -p rivet-engine --bin rivet-engine
      - name: Run conformance
        run: |
          if [[ -x .conformance-engine/target/debug/rivet-engine ]]; then
            export CONFORMANCE_ENGINE_BINARY="$PWD/.conformance-engine/target/debug/rivet-engine"
            export CONFORMANCE_ENGINE_SHA256="$(sha256sum "$CONFORMANCE_ENGINE_BINARY" | cut -d ' ' -f 1)"
          fi
          bash scripts/test-conformance.sh
        env:
          CONFORMANCE_KEEP_LOGS: "1"
          # A published compatible Engine overrides the pinned source build.
          CONFORMANCE_ENGINE_URL: ${{ vars.CONFORMANCE_ENGINE_URL }}
          CONFORMANCE_ENGINE_SHA256: ${{ vars.CONFORMANCE_ENGINE_SHA256 }}
          CONFORMANCE_ENGINE_VERSION: ${{ vars.CONFORMANCE_ENGINE_VERSION }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-test-logs
          path: |
            /tmp/rivet-durable-streams-conformance.*/conformance.log
            /tmp/rivet-durable-streams-conformance.*/engine.log
            /tmp/rivet-durable-streams-conformance.*/server.log
            /tmp/rivet-durable-streams-conformance.*/e2e.log
            /tmp/rivet-durable-streams-conformance.*/large-snapshot.log
            /tmp/rivet-durable-streams-conformance.*/recovery.log
            /tmp/rivet-durable-streams-conformance.*/recovery/*.log
            /tmp/rivet-durable-streams-conformance.*/recovery/migration/*.log

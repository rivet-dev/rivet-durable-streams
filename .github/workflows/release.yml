name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88

      - name: Verify release version
        id: version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "$GITHUB_REF_NAME" = "v$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: existing
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if curl --fail --silent \
            --user-agent "rivet-durable-streams-release/1.0 (developer@rivet.dev)" \
            "https://crates.io/api/v1/crates/rivet-durable-streams/$VERSION" >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: cargo test --locked

      - name: Authenticate with crates.io
        if: steps.existing.outputs.published != 'true'
        id: crates-io
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        if: steps.existing.outputs.published != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}

      - name: Notify managed services
        env:
          GH_TOKEN: ${{ secrets.MANAGED_SERVICES_DISPATCH_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh api --method POST /repos/rivet-dev/services/dispatches \
            -f event_type=downstream-release \
            -f client_payload[product]=durable-streams \
            -f client_payload[version]="$VERSION" \
            -f client_payload[sha]="$GITHUB_SHA"
